services:
  backend:
    build: .
    command: python -m uvicorn app.backend.main:app --host 0.0.0.0 --port 8000
    environment:
      AUTODS_ENV: docker
      AUTODS_RUNS_DIR: /app/runs
      AUTODS_LOG_LEVEL: ${AUTODS_LOG_LEVEL:-INFO}
      AUTODS_ENABLE_MLFLOW: ${AUTODS_ENABLE_MLFLOW:-true}
      AUTODS_MLFLOW_TRACKING_URI: ${AUTODS_MLFLOW_TRACKING_URI:-http://mlflow:5000}
      AUTODS_MLFLOW_EXPERIMENT_NAME: ${AUTODS_MLFLOW_EXPERIMENT_NAME:-AutoDS-Agent}
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - ./mlruns:/app/mlruns
    depends_on:
      - mlflow

  frontend:
    build: .
    command: python -m streamlit run app/frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false
    environment:
      AUTODS_ENV: docker
      AUTODS_BACKEND_URL: http://backend:8000
      AUTODS_LOG_LEVEL: ${AUTODS_LOG_LEVEL:-INFO}
    ports:
      - "8501:8501"
    depends_on:
      - backend

  mlflow:
    build: .
    command: python -m mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /app/mlruns --default-artifact-root /app/mlruns
    environment:
      AUTODS_ENV: docker
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
