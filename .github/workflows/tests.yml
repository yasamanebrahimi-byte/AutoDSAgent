name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint Python sources
        run: python -m ruff check app evaluation tests scripts

  offline-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run offline end-to-end smoke test
        run: >-
          python -m app
          --data examples/sample_data/diabetes_progression.csv
          --target disease_progression
          --question "Estimate disease progression from the supplied measurements."
          --output-dir "${{ runner.temp }}/autods-agent-smoke"
          --offline

      - name: Run evaluation harness smoke test
        run: >-
          python -m evaluation.run
          --offline
          --case wine
          --repetitions 1
          --output "${{ runner.temp }}/autods-agent-evaluation-smoke"
