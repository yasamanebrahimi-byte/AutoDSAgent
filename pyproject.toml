[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autods-agent"
version = "0.1.0"
description = "A deterministic automated data science workflow for tabular CSV datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "streamlit>=1.36,<2.0",
  "pandas>=2.2,<3.0",
  "matplotlib>=3.8,<4.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "requests>=2.32,<3.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<1.0"
]
mlflow = [
  "mlflow>=2.14,<3.0",
  "setuptools>=68,<81"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"
cache_dir = ".pytest_tmp_cache"
