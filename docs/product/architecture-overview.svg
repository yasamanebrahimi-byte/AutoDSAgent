<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
  <title id="title">AutoDS Agent compact architecture</title>
  <desc id="desc">CSV and user controls flow through Streamlit and FastAPI into an agent-structured deterministic workflow, then services create state, artifacts, reports, models, and optional MLflow tracking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c171c"/><stop offset="1" stop-color="#101f24"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#8ce8c9"/><stop offset="1" stop-color="#42cba3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52777b"/></marker>
    <style>
      .k{font:700 13px Inter,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;fill:#6f8d90}.h{font:700 22px Inter,Arial,sans-serif;fill:#eef7f5}.p{font:400 14px Inter,Arial,sans-serif;fill:#8fa7a9}.box{fill:#13252b;stroke:#284047;stroke-width:1.5}.accent{fill:#102b26;stroke:#59d3ad;stroke-width:1.5}.chip{fill:#183138;stroke:#2e4a51}.ct{font:600 12px Inter,Arial,sans-serif;fill:#b8cccc}.a{fill:none;stroke:#52777b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="410" rx="28" fill="url(#bg)"/>
  <text x="55" y="54" class="k">Deterministic, auditable tabular AutoML and MLOps</text>
  <text x="55" y="87" class="h">One run, explicit boundaries, inspectable outputs</text>

  <g filter="url(#shadow)">
    <rect x="55" y="130" width="235" height="180" rx="18" class="box"/>
    <text x="78" y="163" class="k">Interfaces</text><text x="78" y="198" class="h">CSV + user intent</text>
    <rect x="78" y="222" width="83" height="32" rx="9" class="chip"/><text x="97" y="243" class="ct">Streamlit</text>
    <rect x="170" y="222" width="96" height="32" rx="9" class="chip"/><text x="193" y="243" class="ct">FastAPI</text>
    <text x="78" y="282" class="p">Upload · targets · approvals</text>

    <rect x="365" y="130" width="285" height="180" rx="18" class="accent"/>
    <text x="388" y="163" class="k">Agent-structured workflow</text><text x="388" y="198" class="h">Persistent orchestration</text>
    <text x="388" y="229" class="p">Profile → clean → EDA → model → report</text>
    <rect x="388" y="250" width="119" height="32" rx="9" fill="url(#mint)"/><text x="408" y="271" style="font:700 12px Inter,Arial;fill:#082019">Approval gate</text>
    <text x="519" y="271" class="p">retry · skip · resume</text>

    <rect x="725" y="130" width="275" height="180" rx="18" class="box"/>
    <text x="748" y="163" class="k">Deterministic services</text><text x="748" y="198" class="h">pandas + scikit-learn</text>
    <text x="748" y="229" class="p">Profiling · lineage · CV selection</text>
    <text x="748" y="256" class="p">Untouched holdout · report synthesis</text>
    <text x="748" y="283" class="p">Per-run locking · atomic JSON</text>

    <rect x="1075" y="130" width="270" height="180" rx="18" class="box"/>
    <text x="1098" y="163" class="k">Inspectable outputs</text><text x="1098" y="198" class="h">Run artifact store</text>
    <text x="1098" y="229" class="p">Raw data · state · trace · plots</text>
    <text x="1098" y="256" class="p">Models · metrics · final reports</text>
    <rect x="1098" y="272" width="111" height="27" rx="8" class="chip"/><text x="1121" y="290" class="ct">Filesystem</text>
    <rect x="1219" y="272" width="102" height="27" rx="8" class="chip"/><text x="1239" y="290" class="ct">MLflow*</text>
  </g>

  <path d="M290 220H354" class="a"/><path d="M650 220H714" class="a"/><path d="M1000 220H1064" class="a"/>
  <text x="55" y="365" class="p">* Optional tracking. Core execution remains local and deterministic without paid APIs.</text>
</svg>
